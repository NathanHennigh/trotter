<!-- Sanitized card nesting from a Bilt confirmation; every variable field is synthetic. -->
<table border="0" cellpadding="0" cellspacing="0">
 <tbody>
  <tr>
   <td colspan="2">
    <table>
     <tr>
      <td align="left" valign="middle">
       <table border="0" cellpadding="0" cellspacing="0">
        <tr>
         <td valign="middle">
          <a href="https://example.invalid/flight">
           {{flight}}
          </a>
         </td>
        </tr>
       </table>
      </td>
      <td align="right" valign="middle">
       <img alt="Clock" src="https://example.invalid/clock.png" width="16"/>
       <p align="right">
        {{duration}}
       </p>
      </td>
     </tr>
    </table>
   </td>
  </tr>
  <tr>
   <td>
    <table>
     <tr>
      <td colspan="3">
       <table>
        <tr>
         <td valign="top" width="20">
          <img alt="Clock" height="8" src="https://example.invalid/clock.png" width="8"/>
          <div>
          </div>
          <img alt="Clock" height="8" src="https://example.invalid/clock.png" width="8"/>
         </td>
         <td valign="top">
          <table border="0" cellpadding="0" cellspacing="0">
           <tr>
            <td align="left" valign="top">
             <p align="left">
              {{dep_code}}
             </p>
             <p align="left">
              {{dep_city}}
             </p>
            </td>
            <td align="right" valign="top">
             <p align="right">
              {{dep_time}}
             </p>
             <p align="right">
              {{dep_date}}
             </p>
            </td>
           </tr>
           <tr>
            <td colspan="2">
             <table>
              <tr>
               <td>
                <p align="left">
                 Class
                </p>
                <p align="left">
                 Economy
                </p>
               </td>
               <td>
               </td>
               <td>
                <p align="left">
                 Seats
                </p>
                <p align="left">
                 --
                </p>
               </td>
              </tr>
             </table>
            </td>
           </tr>
           <tr>
            <td align="left" valign="top">
             <p align="left">
              {{arr_code}}
             </p>
             <p align="left">
              {{arr_city}}
             </p>
            </td>
            <td align="right" valign="top">
             <p align="right">
              {{arr_time}}
             </p>
             <p align="right">
              {{arr_date}}
             </p>
            </td>
           </tr>
          </table>
         </td>
        </tr>
       </table>
      </td>
     </tr>
    </table>
   </td>
  </tr>
 </tbody>
</table>

<!-- iOS device frame components (inlined from ios-frame.jsx) -->
<script type="text/babel">
// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'hidden', position: 'relative' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});
</script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #060810;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Outfit', sans-serif;
    overflow: hidden;
  }
  body::before {

    position: fixed;
    inset: 0;

                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(0,240,255,0.04) 0%, transparent 60%);

  /* Tweaks panel */
  #tweaks-panel {
    display: none;

    box-shadow: 0 2px 0 rgba(255,255,255,0.1) inset, 0 8px 32px rgba(0,0,0,0.5);

    -webkit-backdrop-filter: blur(40px);
  }
  #tweaks-panel.open { display: block; }
  #tweaks-panel h3 { color: #FAFAFA; font-size: 14px; font-weight: 600; margin-bottom: 16px; letter-spacing: 0.05em; text-transform: uppercase; }
  .tweak-row { margin-bottom: 14px; }
  .tweak-label { color: #9BA4B5; font-size: 12px; margin-bottom: 6px; display: block; }
  .tweak-options { display: flex; gap: 6px; flex-wrap: wrap; }
  .tweak-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: #FAFAFA;

    padding: 5px 10px;

    transition: all 0.2s;
  }
  .tweak-btn.active { background: rgba(255,90,0,0.25); border-color: #FF5A00; color: #FF5A00; }
  .tweak-toggle { display: flex; align-items: center; justify-content: space-between; }
  .toggle-switch {
    width: 36px; height: 20px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    cursor: pointer;
    position: relative;
    transition: background 0.2s;
  }
  .toggle-switch.on { background: #FF5A00; }
  .toggle-switch::after {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    background: white;
    border-radius: 50%;
    top: 2px; left: 2px;
    transition: transform 0.2s;
  }
  .toggle-switch.on::after { transform: translateX(16px); }
</style>
</head>
<body>
<div id="root"></div>
<div id="tweaks-panel">
  <h3>Tweaks</h3>
  <div class="tweak-row">
    <span class="tweak-label">Arc Style</span>
    <div class="tweak-options">
      <button class="tweak-btn active" onclick="setTweak('arcStyle','glow')">Glow</button>
      <button class="tweak-btn" onclick="setTweak('arcStyle','solid')">Solid</button>
      <button class="tweak-btn" onclick="setTweak('arcStyle','dashed')">Dashed</button>
    </div>
  </div>
  <div class="tweak-row">
    <span class="tweak-label">Sheet Default</span>
    <div class="tweak-options">
      <button class="tweak-btn active" onclick="setTweak('sheetDefault','peek')">Peek</button>
      <button class="tweak-btn" onclick="setTweak('sheetDefault','half')">Half</button>
    </div>
  </div>
  <div class="tweak-row">
    <div class="tweak-toggle">
      <span class="tweak-label" style="margin-bottom:0">Show Pending Banner</span>
      <div class="toggle-switch on" id="toggle-pending" onclick="toggleTweak('showPending')"></div>
    </div>
  </div>
  <div class="tweak-row">
    <div class="tweak-toggle">
      <span class="tweak-label" style="margin-bottom:0">Animate Arcs</span>
      <div class="toggle-switch on" id="toggle-animate" onclick="toggleTweak('animateArcs')"></div>
    </div>
  </div>
</div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ─── TWEAK STATE ───────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = {
  arcStyle: 'glow',
  sheetDefault: 'peek',
  showPending: true,
  animateArcs: false,
};

let tweakState = { ...TWEAK_DEFAULTS };
const tweakListeners = new Set();

window.setTweak = (key, val) => {
  tweakState = { ...tweakState, [key]: val };
  document.querySelectorAll('.tweak-options .tweak-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tweak-options .tweak-btn').forEach(b => {
    if (b.textContent.toLowerCase() === val) b.classList.add('active');
  });
  tweakListeners.forEach(fn => fn({ ...tweakState }));
};
window.toggleTweak = (key) => {
  tweakState = { ...tweakState, [key]: !tweakState[key] };
  const el = document.getElementById('toggle-' + key.replace(/([A-Z])/g, m => '-' + m.toLowerCase()).replace(/^-/, ''));
  if (el) el.classList.toggle('on', tweakState[key]);
  tweakListeners.forEach(fn => fn({ ...tweakState }));
};

function useTweaks() {
  const [t, setT] = useState({ ...tweakState });
  useEffect(() => {
    tweakListeners.add(setT);
    return () => tweakListeners.delete(setT);
  }, []);
  return t;
}

// ─── EDIT MODE ─────────────────────────────────────────────────────────────────
window.addEventListener('message', e => {
  if (e.data?.type === '__activate_edit_mode') document.getElementById('tweaks-panel').classList.add('open');
  if (e.data?.type === '__deactivate_edit_mode') document.getElementById('tweaks-panel').classList.remove('open');
});

// ─── DATA ──────────────────────────────────────────────────────────────────────
const FLIGHTS = [
  { id: 1, from: 'JFK', to: 'LHR', fromCity: 'New York',      toCity: 'London',       date: 'Apr 14, 2026', airline: 'BA', miles: 3459, count: 3, lat1: 40.6, lon1: -73.8,  lat2: 51.5, lon2: -0.5   },
  { id: 2, from: 'LHR', to: 'DXB', fromCity: 'London',        toCity: 'Dubai',        date: 'Apr 15, 2026', airline: 'EK', miles: 3413, count: 2, lat1: 51.5, lon1: -0.5,   lat2: 25.2, lon2: 55.4   },

// ─── GLOBE ─────────────────────────────────────────────────────────────────────
function Globe({ selectedFlight, onSelectFlight, tweaks }) {
  const canvasRef = useRef(null);
  const animRef   = useRef(null);
  const rotRef    = useRef([20, -10]);
  const velRef    = useRef(0.08);
  const dragRef   = useRef(null);
  const topoRef   = useRef(null);
  const timeRef   = useRef(0);

  useEffect(() => {
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
      .then(r => r.json())
      .then(world => { topoRef.current = topojson.feature(world, world.objects.land); });
  }, []);

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx    = canvas.getContext('2d');

    const resize = () => {
      canvas.width  = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    };
    resize();

    const getProjection = () => {
      const W = canvas.width, H = canvas.height;
      const R = Math.min(W, H) * 0.42;
      return d3.geoOrthographic()
        .scale(R)
        .translate([W / 2, H / 2])
        .rotate(rotRef.current)
        .clipAngle(90);
    };

    const arcCoords = FLIGHTS.map(f => {
      const pts = [];
      for (let i = 0; i <= 64; i++) {
        pts.push(d3.geoInterpolate([f.lon1, f.lat1], [f.lon2, f.lat2])(i / 64));
      }
      return pts;
    });

    const drawGlobe = (t) => {
      const W = canvas.width, H = canvas.height;
      const R = Math.min(W, H) * 0.42;
      const cx = W / 2, cy = H / 2;
      ctx.clearRect(0, 0, W, H);

      const proj = getProjection();
      const path = d3.geoPath(proj, ctx);

      // Ocean
      const grad = ctx.createRadialGradient(cx - R * 0.15, cy - R * 0.15, R * 0.05, cx, cy, R);
      grad.addColorStop(0, '#182236');
      grad.addColorStop(1, '#0B0E14');
      ctx.beginPath();
      path({ type: 'Sphere' });
      ctx.fillStyle = grad;
      ctx.fill();

      // Atmosphere rim
      const atm = ctx.createRadialGradient(cx, cy, R * 0.96, cx, cy, R * 1.10);
      atm.addColorStop(0, 'rgba(0,240,255,0.09)');
      atm.addColorStop(1, 'rgba(0,240,255,0)');
      ctx.beginPath();
      ctx.arc(cx, cy, R * 1.10, 0, Math.PI * 2);
      ctx.fillStyle = atm;
      ctx.fill();

      // Graticule
      ctx.beginPath();
      path(d3.geoGraticule()());
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth   = 0.5;
      ctx.stroke();

      // Land
      if (topoRef.current) {
        ctx.beginPath();
        path(topoRef.current);
        ctx.fillStyle   = '#1e2d44';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.06)';
        ctx.lineWidth   = 0.4;
        ctx.stroke();
      }

      // Globe edge rim
      ctx.beginPath();
      path({ type: 'Sphere' });
      ctx.strokeStyle = 'rgba(0,240,255,0.15)';
      ctx.lineWidth   = 1;
      ctx.stroke();

      // Flight arcs — d3.geoPath handles horizon clipping
      FLIGHTS.forEach((f, fi) => {
        const isSelected = selectedFlight?.id === f.id;
        const isDimmed   = selectedFlight && !isSelected;

        const lineGeo = {
          type: 'Feature',
          geometry: { type: 'LineString', coordinates: arcCoords[fi] },
        };

        ctx.save();
        if (tweaks.arcStyle === 'glow') {
          ctx.shadowBlur  = isSelected ? 20 : (isDimmed ? 0 : 10);
          ctx.shadowColor = '#FF5A00';
          ctx.strokeStyle = isDimmed ? 'rgba(255,90,0,0.18)' : (isSelected ? '#FF7A30' : '#FF5A00');
          ctx.lineWidth   = isDimmed ? 0.8 : (isSelected ? 2.8 : 1 + f.count * 0.28);
        } else if (tweaks.arcStyle === 'solid') {
          ctx.shadowBlur  = 0;
          ctx.strokeStyle = isDimmed ? 'rgba(255,90,0,0.18)' : '#FF5A00';
          ctx.lineWidth   = isDimmed ? 0.6 : (isSelected ? 2.5 : 1 + f.count * 0.25);
        } else {
          ctx.shadowBlur  = isDimmed ? 0 : 5;
          ctx.shadowColor = 'rgba(255,90,0,0.6)';
          ctx.strokeStyle = isDimmed ? 'rgba(255,90,0,0.18)' : '#FF5A00';
          ctx.lineWidth   = 1.5;
          ctx.setLineDash([5, 5]);
        }

        const pulse = tweaks.animateArcs ? 0.7 + 0.3 * Math.sin(t * 0.002 + fi * 1.3) : 1;
        ctx.globalAlpha = pulse;

        ctx.beginPath();
        path(lineGeo);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();

        // Endpoint dots — skip if behind the globe
        if (!isDimmed) {
          const projCenter = [-rotRef.current[0], -rotRef.current[1]];
          [[f.lon1, f.lat1], [f.lon2, f.lat2]].forEach(coord => {
            if (d3.geoDistance(coord, projCenter) > Math.PI / 2) return;
            const dot = proj(coord);
            if (!dot) return;
            const dg = ctx.createRadialGradient(dot[0], dot[1], 0, dot[0], dot[1], isSelected ? 10 : 6);
            dg.addColorStop(0, isSelected ? 'rgba(0,240,255,0.7)' : 'rgba(255,90,0,0.5)');
            dg.addColorStop(1, 'transparent');
            ctx.beginPath();
            ctx.arc(dot[0], dot[1], isSelected ? 10 : 6, 0, Math.PI * 2);
            ctx.fillStyle = dg;
            ctx.fill();
            ctx.beginPath();
            ctx.arc(dot[0], dot[1], isSelected ? 3.5 : 2.5, 0, Math.PI * 2);
            ctx.fillStyle   = isSelected ? '#00F0FF' : '#fff';
            ctx.shadowBlur  = isSelected ? 12 : 5;
            ctx.shadowColor = isSelected ? '#00F0FF' : '#fff';
            ctx.fill();
            ctx.shadowBlur = 0;
          });
        }
      });

      ctx.globalAlpha = 1;
      ctx.shadowBlur  = 0;
    };

    const loop = (t) => {
      timeRef.current = t;
      if (!dragRef.current) {
        rotRef.current = [rotRef.current[0] + velRef.current, rotRef.current[1]];
      }
      drawGlobe(t);
      animRef.current = requestAnimationFrame(loop);
    };
    animRef.current = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(animRef.current);
  }, [selectedFlight, tweaks]);

  const onPointerDown = (e) => {
    dragRef.current = { x: e.clientX, y: e.clientY, rot: [...rotRef.current] };
  };
  const onPointerMove = (e) => {
    if (!dragRef.current) return;
    const dx = e.clientX - dragRef.current.x;
    const dy = e.clientY - dragRef.current.y;
    rotRef.current = [
      dragRef.current.rot[0] + dx * 0.3,
      Math.max(-80, Math.min(80, dragRef.current.rot[1] - dy * 0.3)),
    ];
  };
  const onPointerUp = () => { dragRef.current = null; };

  const onClick = useCallback((e) => {
    const canvas = canvasRef.current;
    const rect   = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const W = canvas.width, H = canvas.height;
    const R = Math.min(W, H) * 0.42;
    const cx = W / 2, cy = H / 2;

    let hit = null, minDist = 18;
    const projCenter = [-rotRef.current[0], -rotRef.current[1]];
    const clickProj = d3.geoOrthographic().scale(R).translate([cx, cy]).rotate(rotRef.current).clipAngle(90);
    FLIGHTS.forEach((f) => {
      for (let i = 0; i <= 64; i++) {
        const coord = d3.geoInterpolate([f.lon1, f.lat1], [f.lon2, f.lat2])(i / 64);
        if (d3.geoDistance(coord, projCenter) > Math.PI / 2) continue;
        const pt = clickProj(coord);
        if (!pt) continue;
        const d = Math.hypot(pt[0] - mx, pt[1] - my);
        if (d < minDist) { minDist = d; hit = f; }
      }
    });
    onSelectFlight(hit ? (selectedFlight?.id === hit.id ? null : hit) : null);
  }, [selectedFlight, onSelectFlight]);

  return (
    <canvas
      ref={canvasRef}
      style={{ width: '100%', height: '100%', cursor: 'grab', display: 'block' }}
      onPointerDown={onPointerDown}
      onPointerMove={onPointerMove}
      onPointerUp={onPointerUp}
      onPointerLeave={onPointerUp}
      onClick={onClick}
    />
  );
}

// ─── BOTTOM SHEET ──────────────────────────────────────────────────────────────
const STATES = [0.22, 0.50, 0.90];

function BottomSheet({ selectedFlight, onSelectFlight, tweaks }) {
  const initState = tweaks.sheetDefault === 'half' ? 1 : 0;
  const [snap, setSnap]         = useState(initState);
  const [dragging, setDragging] = useState(false);
  const [dragDy, setDragDy]     = useState(0);
  const startRef = useRef(null);

  const heightFrac = STATES[snap] + (dragging ? -dragDy / 844 : 0);
  const clampedH   = Math.min(0.93, Math.max(0.14, heightFrac));

  const settle = (frac) => {
    const diffs = STATES.map((s, i) => ({ i, d: Math.abs(s - frac) }));
    diffs.sort((a, b) => a.d - b.d);
    setSnap(diffs[0].i);
    setDragging(false);
    setDragDy(0);
  };

  const onTouchStart = (e) => {
    startRef.current = { y: e.touches[0].clientY };
    setDragging(true); setDragDy(0);
  };
  const onTouchMove = (e) => {
    if (!startRef.current) return;
    setDragDy(e.touches[0].clientY - startRef.current.y);
  };
  const onTouchEnd = () => settle(clampedH);

  const onMouseDown = (e) => {
    startRef.current = { y: e.clientY };
    setDragging(true); setDragDy(0);
    const move = (ev) => setDragDy(ev.clientY - startRef.current.y);
    const up   = () => {
      settle(Math.min(0.93, Math.max(0.14, STATES[snap] + -dragDy / 844)));
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  return (
    <div style={{
      position: 'absolute', bottom: 0, left: 0, right: 0,
      height: `${clampedH * 100}%`,
      background: 'linear-gradient(180deg, rgba(255,255,255,0.09) 0%, rgba(11,14,20,0.88) 8%)',
      backdropFilter: 'blur(40px)', WebkitBackdropFilter: 'blur(40px)',
      borderTop: '1px solid rgba(255,255,255,0.18)',
      boxShadow: '0 -1px 0 0 rgba(255,255,255,0.08) inset',
      borderRadius: '24px 24px 0 0',
      transition: dragging ? 'none' : 'height 0.38s cubic-bezier(0.4,0,0.2,1)',
      zIndex: 20,
      display: 'flex', flexDirection: 'column',
      overflow: 'hidden',
    }}>
      {/* Handle */}
      <div
        style={{ padding: '14px 0 4px', flexShrink: 0, cursor: 'grab', userSelect: 'none' }}
        onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
        onMouseDown={onMouseDown}
      >
        <div style={{ width: 36, height: 4, background: 'rgba(255,255,255,0.2)', borderRadius: 2, margin: '0 auto' }} />
        <div style={{ padding: '10px 20px 0', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <div style={{ color: '#FAFAFA', fontWeight: 700, fontSize: 17 }}>Travel Log</div>
          <div style={{ color: '#9BA4B5', fontSize: 12 }}>{FLIGHTS.length} flights</div>
        </div>
      </div>

      {/* Pending banner */}
      {tweaks.showPending && (
        <div style={{
          margin: '6px 16px 0',
          background: 'linear-gradient(135deg, rgba(255,90,0,0.12) 0%, rgba(255,90,0,0.05) 100%)',
          border: '1px solid rgba(255,90,0,0.3)',
          boxShadow: '0 1px 0 rgba(255,255,255,0.08) inset',
          backdropFilter: 'blur(16px)', WebkitBackdropFilter: 'blur(16px)',
          borderRadius: 12, padding: '9px 14px',
          display: 'flex', alignItems: 'center', gap: 10,
          flexShrink: 0,
        }}>
          <div style={{
            width: 6, height: 6, borderRadius: '50%', background: '#FF5A00',
            boxShadow: '0 0 8px #FF5A00', flexShrink: 0,
            animation: 'pulse 2s infinite',
          }} />
          <div style={{ flex: 1 }}>
            <span style={{ color: '#FF5A00', fontWeight: 600, fontSize: 12 }}>3 flights need review</span>
            <span style={{ color: '#9BA4B5', fontSize: 11 }}> · tap to confirm</span>
          </div>
          <div style={{ color: '#9BA4B5', fontSize: 13 }}>›</div>
        </div>
      )}

      {/* Scrollable list */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '10px 16px 16px', display: 'flex', flexDirection: 'column', gap: 9 }}>
        {FLIGHTS.map(f => (
          <TripCard
            key={f.id}
            flight={f}
            isSelected={selectedFlight?.id === f.id}
            onClick={(fl) => onSelectFlight(selectedFlight?.id === fl.id ? null : fl)}
          />
        ))}
      </div>
    </div>
  );
}

            color: '#fff', fontWeight: 700, fontSize: 13, cursor: 'pointer',
          }}>N</div>
        </div>
      </div>

      {/* Stats pill */}
      <div style={{ position: 'absolute', top: 70, left: '50%', transform: 'translateX(-50%)', zIndex: 25 }}>
        <StatsPill />
      </div>

      {/* Arc callout */}
      <ArcCallout flight={selectedFlight} onClose={() => setSelectedFlight(null)} />

      {/* Bottom sheet */}
      <BottomSheet selectedFlight={selectedFlight} onSelectFlight={setSelectedFlight} tweaks={tweaks} />
    </div>
  );
}

// ─── ROOT (iOS device wrapper) ─────────────────────────────────────────────────
function Root() {
  return (
    <div style={{
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      width: '100vw', height: '100vh',
      gap: 60,
    }}>
      <div style={{ textAlign: 'center' }}>
        <IOSDevice dark={true}>
          <App />
        </IOSDevice>
        <p style={{ color: '#9BA4B5', fontSize: 12, marginTop: 16, fontFamily: "'Outfit', sans-serif" }}>
          Drag globe to spin · Tap arc to highlight · Drag sheet up/down
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>

<style>
@keyframes fadeSlideDown {
  from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.4; }
}
@keyframes spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
::-webkit-scrollbar { width: 0; }
</style>
</body>
</html>
